name: CI Evaluation & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest Test Suite
      env:
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        PYTHONPATH: .
      run: |
        pytest -v

    - name: Run Evaluation Benchmark Harness
      env:
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        PYTHONPATH: .
      run: |
        python -c "import asyncio; from src.eval_harness import eval_harness; asyncio.run(eval_harness.run_all())"

    - name: Verify Evaluation Report Artifact
      run: |
        test -f eval_report.json
        cat eval_report.json
